<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#131418">

  <title>KARINA PLAYLIST</title>

  <!-- Open Graph 標籤 -->
  <meta property="og:site_name" content="KARINA PLAYLIST">
  <meta property="og:title" content="KARINA PLAYLIST">
  <meta property="og:description" content="Playlist for KARINA">
  <meta name="description" content="Playlist for KARINA">
  <meta property="og:type" content="music.playlist">
  <meta property="og:url" content="https://u11150003-arch.github.io/KARINA-PLAYLIST/">
  
  <meta property="og:image" content="https://u11150003-arch.github.io/KARINA-PLAYLIST/UP_cover.jpg">
  <meta property="og:image:secure_url" content="https://u11150003-arch.github.io/KARINA-PLAYLIST/UP_cover.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="KARINA PLAYLIST">
  <meta name="twitter:description" content="Playlist for KARINA">
  <meta name="twitter:image" content="https://u11150003-arch.github.io/KARINA-PLAYLIST/UP_cover.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Syne:wght@500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Chocolate Classical Sans';
      src: local('Chocolate Classical Sans'), local('ChocolateClassicalSans'), local('Chocolate Classical Sans Medium');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg: #18191e;
      --deck-bg: #131418;
      --steel: #f4f4f5;
      --steel-dim: #9ca3af;
      --steel-border: #2a2c35;
      --accent-glow: rgba(244, 244, 245, 0.25);
      /* 白色愛心 (低透明度) 游標 */
      --heart-cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="rgba(255,255,255,0.45)" stroke="rgba(0,0,0,0.4)" stroke-width="0.8" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>') 12 12, pointer;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button, select, input[type="range"], .menu-link-item, .seek-groove, .lyric-row, .brand-title {
      cursor: var(--heart-cursor) !important;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--bg) !important;
      color: var(--steel);
      font-family: 'Syne', 'Chocolate Classical Sans', 'Noto Sans TC', sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      padding: calc(12px + env(safe-area-inset-top, 0px)) 20px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      background: var(--bg) !important;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
    }

    /* 右上角愛心微調加大 */
    .admin-star-btn {
      background: none;
      border: none;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      padding: 4px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 1.55rem;
      line-height: 1;
      transition: all 0.25s ease;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.35);
    }
    .admin-star-btn:hover, .admin-star-btn:active {
      color: rgba(255, 255, 255, 1);
      transform: scale(1.15);
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: var(--bg) !important;
    }

    #threejs-box {
      width: 100%;
      height: 52%;
      position: relative;
      touch-action: none;
      cursor: grab;
      background: transparent !important;
    }
    #threejs-box:active {
      cursor: grabbing;
    }

    .info-lyrics-container {
      height: 48%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding: 0 16px;
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    }

    .track-meta {
      text-align: center;
      margin-bottom: 2px;
      z-index: 10;
    }
    .track-meta h1 {
      font-family: 'Orbitron', 'Syne', 'Chocolate Classical Sans', sans-serif;
      font-size: 1.05rem;
      letter-spacing: 1px;
      color: #ffffff;
    }
    .track-meta p {
      font-size: 0.75rem;
      color: var(--steel-dim);
      margin-top: 2px;
      font-family: 'Syne', sans-serif;
      letter-spacing: 1px;
    }

    .lyrics-view {
      width: 100%;
      max-width: 580px;
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px 16px 80px;
      scrollbar-width: none;
    }
    .lyrics-view::-webkit-scrollbar {
      display: none;
    }

    .lyric-row {
      text-align: center;
      color: #6b7280;
      line-height: 1.45;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .lyric-primary {
      font-size: 0.85rem;
      font-family: 'Syne', 'Chocolate Classical Sans', sans-serif;
    }
    .lyric-trans {
      font-size: 0.78rem;
      color: #585c6d;
      font-family: 'Chocolate Classical Sans', sans-serif;
      letter-spacing: 0.5px;
    }

    .lyric-row.active {
      transform: scale(1.02);
    }
    .lyric-row.active .lyric-primary {
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }
    .lyric-row.active .lyric-trans {
      color: #e4e4e7;
      font-size: 0.88rem;
      font-weight: 500;
    }

    footer.retro-deck {
      background: var(--deck-bg) !important;
      border-top: 1px solid var(--steel-border);
      box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
      padding: 10px 14px calc(24px + env(safe-area-inset-bottom, 20px));
      z-index: 25;
      width: 100%;
      flex-shrink: 0;
    }

    .timeline-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 480px;
      margin: 0 auto 10px;
      padding: 0 4px;
    }
    .retro-time {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      color: var(--steel-dim);
      min-width: 36px;
    }

    .seek-groove {
      flex: 1;
      height: 24px;
      display: flex;
      align-items: center;
      position: relative;
      touch-action: none;
    }
    .seek-track {
      width: 100%;
      height: 4px;
      background: #23252d;
      border-radius: 2px;
      position: relative;
    }
    .seek-bar {
      height: 100%;
      background: linear-gradient(90deg, #6b7280, #e4e4e7);
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
      position: relative;
    }
    .seek-thumb {
      position: absolute;
      right: -5px;
      top: -4px;
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255,255,255,0.8);
      pointer-events: none;
    }

    .deck-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 480px;
      margin: 0 auto;
      gap: 8px;
      padding: 0 2px;
    }

    .steel-select-group {
      display: flex;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .steel-select {
      background: #1c1d24;
      border: 1px solid #333642;
      color: #e4e4e7;
      font-family: 'Syne', sans-serif !important;
      font-size: 0.7rem;
      letter-spacing: 0.2px;
      font-weight: 600;
      padding: 5px 6px;
      border-radius: 6px;
      outline: none;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    #sel-playlist {
      flex: 0 0 120px;
      min-width: 110px;
    }
    #sel-song {
      flex: 1;
      min-width: 0;
    }

    .steel-select:focus, .steel-select:hover {
      border-color: #555869;
    }
    .steel-select option {
      font-family: 'Syne', sans-serif !important;
      background: #1c1d24;
      color: #fff;
    }

    /* 電腦版排版加寬：KARINA MEMORY BOX 完全不被截斷 */
    @media (min-width: 768px) {
      .timeline-strip, .deck-controls {
        max-width: 780px;
      }
      .steel-select {
        font-size: 0.8rem;
        padding: 7px 12px;
      }
      #sel-playlist {
        flex: 0 0 215px;
        min-width: 200px;
      }
      #sel-song {
        flex: 1;
      }
    }

    .buttons-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .steel-knob-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #2a2c36 0%, #171820 100%);
      border: 1px solid #3e414f;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .steel-knob-btn:active {
      transform: scale(0.92);
    }
    .steel-knob-btn svg {
      width: 14px;
      height: 14px;
      fill: #d1d5db;
    }

    .play-master-btn {
      width: 46px;
      height: 46px;
      background: radial-gradient(circle at 35% 35%, #4b4e5d 0%, #20222a 100%);
      border: 1.5px solid #8b90a0;
      box-shadow: 0 0 12px var(--accent-glow), inset 0 1px 2px rgba(255,255,255,0.25);
    }
    .play-master-btn svg {
      width: 17px;
      height: 17px;
      fill: #ffffff;
    }

    .modal-veil {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-inner {
      background: #181920;
      border: 1px solid #333642;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      font-family: 'Syne', 'Chocolate Classical Sans', sans-serif;
    }
    .modal-inner h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      color: #f4f4f5;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .menu-link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #111216;
      border: 1px solid #282a35;
      border-radius: 8px;
      color: #f4f4f5;
      text-decoration: none;
      font-size: 0.88rem;
      margin-bottom: 8px;
      transition: all 0.2s ease;
    }
    .menu-link-item:hover {
      background: #1d1f27;
      border-color: #4b4e5d;
      transform: translateX(2px);
    }
    .menu-link-item span.desc {
      font-size: 0.72rem;
      color: #9ca3af;
      font-family: 'Chocolate Classical Sans', sans-serif;
    }

    .field-row {
      margin-bottom: 12px;
    }
    .field-row label {
      display: block;
      font-size: 0.78rem;
      color: var(--steel-dim);
      margin-bottom: 4px;
    }
    .field-row input, .field-row textarea, .field-row select {
      width: 100%;
      background: #111216;
      border: 1px solid #2d303a;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      padding: 8px 10px;
      outline: none;
    }
    .field-row textarea {
      font-family: monospace;
      font-size: 0.78rem;
      resize: vertical;
    }
    .btn-steel {
      background: #2b2e3a;
      border: 1px solid #454959;
      color: #fafafa;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid #333642;
      color: #9ca3af;
      padding: 8px 12px;
      border-radius: 6px;
    }
    .song-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: #111216;
      border: 1px solid #242630;
      margin-bottom: 4px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .song-actions {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .btn-act {
      border: none;
      border-radius: 3px;
      padding: 3px 6px;
      font-size: 0.72rem;
    }
    .btn-edit { background: #3b82f6; color: #fff; }
    .btn-del { background: #ef4444; color: #fff; }
    .btn-order { background: #27272a; color: #d4d4d8; border: 1px solid #3f3f46; font-size: 0.7rem; padding: 2px 5px; }
    .btn-order:disabled { opacity: 0.3; cursor: not-allowed; }

    .preview-card-box {
      background: #101115;
      border: 1px dashed #3f4252;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .preview-cover-thumb {
      width: 72px;
      height: 72px;
      border-radius: 4px;
      border: 1px solid #2c2d38;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <!-- 原生 Audio 元件：完全比照 WINTER PLAYLIST 快速串流模式 -->
  <audio id="native-audio" playsinline></audio>
  <iframe id="yt-hidden-player" style="position:absolute; top:-9999px; left:-9999px; width:1px; height:1px;" frameborder="0" allow="autoplay; encrypted-media"></iframe>

  <header>
    <div class="brand-title" id="logo-trigger">KARINA PLAYLIST</div>
    <button class="admin-star-btn" id="btn-open-menu" title="Navigation & Settings">♥</button>
  </header>

  <main>
    <div id="threejs-box"></div>
    <div class="info-lyrics-container">
      <div class="track-meta">
        <h1 id="disp-title">UP</h1>
        <p id="disp-artist">KARINA</p>
      </div>
      <div class="lyrics-view" id="lyrics-scroller"></div>
    </div>
  </main>

  <footer class="retro-deck">
    <div class="timeline-strip">
      <span class="retro-time" id="lbl-curr">00:00</span>
      <div class="seek-groove" id="seek-container">
        <div class="seek-track">
          <div class="seek-bar" id="seek-progress">
            <div class="seek-thumb"></div>
          </div>
        </div>
      </div>
      <span class="retro-time" id="lbl-total">00:00</span>
    </div>

    <div class="deck-controls">
      <div class="steel-select-group">
        <select class="steel-select" id="sel-playlist"></select>
        <select class="steel-select" id="sel-song"></select>
      </div>

      <div class="buttons-group">
        <button class="steel-knob-btn" id="btn-prev" title="上一首">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="steel-knob-btn play-master-btn" id="btn-play" title="播放 / 暫停">
          <svg id="play-svg-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="steel-knob-btn" id="btn-next" title="下一首">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
  </footer>

  <div class="modal-veil" id="nav-modal">
    <div class="modal-inner" style="max-width: 360px;">
      <h3>KARINA SPACE</h3>
      <div style="display:flex; flex-direction:column; gap:4px; margin-top:14px;">
        <div class="menu-link-item" id="menu-btn-admin" style="border-color: #3b82f6; background: rgba(59,130,246,0.08);">
          <div>
            <div style="color: #60a5fa;">⚙️ System Access</div>
            <span class="desc">管理者後台</span>
          </div>
          <span style="color: #60a5fa;">🔒</span>
        </div>
      </div>
      <div style="text-align:right; margin-top:14px;">
        <button class="btn-cancel" id="btn-close-nav">關閉選單</button>
      </div>
    </div>
  </div>

  <div id="admin-mount-point"></div>

  <template id="auth-tpl">
    <div class="modal-veil" id="auth-modal" style="display:flex;">
      <div class="modal-inner" style="max-width: 300px; text-align: center;">
        <h3>System Access</h3>
        <div class="field-row" style="margin-top: 14px;">
          <input type="password" id="auth-input" placeholder="請輸入管理密碼" autocomplete="off">
        </div>
        <div style="display:flex; justify-content:center; gap:8px; margin-top:14px;">
          <button class="btn-cancel" id="btn-auth-close">取消</button>
          <button class="btn-steel" id="btn-auth-submit">驗證</button>
        </div>
      </div>
    </div>
  </template>

  <template id="admin-tpl">
    <div class="modal-veil" id="admin-modal" style="display:flex;">
      <div class="modal-inner">
        <h3>歌單與曲目核心管理</h3>

        <div style="display:flex; gap:8px; margin-bottom:14px;">
          <button class="btn-steel" id="btn-copy-code" style="flex:1; font-size:0.75rem;">📋 複製當前更新程式碼</button>
          <button class="btn-cancel" id="btn-dl-html" style="font-size:0.75rem;">💾 下載更新 HTML</button>
        </div>

        <div style="background:#111216; padding:10px; border-radius:6px; border:1px solid #282a35; margin-bottom:12px;">
          <label style="font-size:0.75rem; color:#a1a1aa; display:flex; justify-content:space-between;">
            <span>黑膠與封面尺寸縮放</span>
            <span id="scale-val-lbl">1.0x</span>
          </label>
          <input type="range" id="scale-slider" min="0.6" max="1.5" step="0.05" value="1.0" style="width:100%; margin-top:6px;">
        </div>

        <div style="background:#111216; padding:10px; border-radius:6px; border:1px solid #282a35; margin-bottom:12px;">
          <label style="font-size:0.78rem; color:#e4e4e7; font-weight:bold;">新增歌單</label>
          <div style="display:flex; gap:8px; margin-top:6px;">
            <input type="text" id="admin-new-pl-name" placeholder="歌單名稱...">
            <button class="btn-steel" id="btn-add-pl">新增</button>
          </div>
        </div>

        <div style="background:#111216; padding:12px; border-radius:6px; border:1px solid #282a35; margin-bottom:12px;">
          <h4 id="form-mode-title" style="color:#fafafa; font-size:0.85rem; margin-bottom:8px;">✦ 新增歌曲</h4>
          <input type="hidden" id="edit-song-id" value="">

          <div class="preview-card-box">
            <div class="preview-cover-thumb" id="preview-box-thumb"></div>
            <div style="flex:1; min-width:0;">
              <div style="font-size:0.72rem; color:#60a5fa; font-weight:bold;">✦ 即時預覽 (LIVE PREVIEW)</div>
              <div id="preview-box-title" style="font-size:0.84rem; font-weight:bold; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px;">歌曲名稱</div>
              <div id="preview-box-artist" style="font-size:0.72rem; color:#9ca3af;">KARINA</div>
            </div>
          </div>

          <div class="field-row">
            <label>所屬歌單</label>
            <select id="form-pl-target"></select>
          </div>
          <div class="field-row">
            <label>歌曲名稱</label>
            <input type="text" id="form-song-title" placeholder="例如：UP">
          </div>
          <div class="field-row">
            <label>演唱者 / 專輯名稱</label>
            <input type="text" id="form-song-artist" placeholder="KARINA" value="KARINA">

    function parseLrc(txt) {
      if (!txt) return [];
      const lines = txt.split('\n');
      const result = [];
      let currentItem = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const m = line.match(/\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)/);
        if (m) {
          if (currentItem) result.push(currentItem);
          const t = parseInt(m[1]) * 60 + parseFloat(m[2]);
          currentItem = { time: t, text: m[3] || '', trans: '' };
        } else if (currentItem && !currentItem.trans) {
          currentItem.trans = line;
        }
      }
      if (currentItem) result.push(currentItem);
      return result.sort((a,b) => a.time - b.time);
    }

    function createShadowCanvas() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(256, 256, 30, 256, 256, 240);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0.7)');
      grad.addColorStop(0.5, 'rgba(0, 0, 0, 0.3)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);
      return new THREE.CanvasTexture(c);
    }

    function createGrooveVinylTexture() {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#0f1014';
      ctx.fillRect(0, 0, 1024, 1024);

      const grad = ctx.createConicGradient(0, 512, 512);
      grad.addColorStop(0.00, 'rgba(15, 16, 20, 1)');
      grad.addColorStop(0.12, 'rgba(65, 68, 80, 0.65)');
      grad.addColorStop(0.25, 'rgba(15, 16, 20, 1)');
      grad.addColorStop(0.50, 'rgba(15, 16, 20, 1)');
      grad.addColorStop(0.62, 'rgba(65, 68, 80, 0.65)');
      grad.addColorStop(0.75, 'rgba(15, 16, 20, 1)');
      grad.addColorStop(1.00, 'rgba(15, 16, 20, 1)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(512, 512, 500, 0, Math.PI * 2);
      ctx.fill();

      for (let r = 85; r < 496; r += 2.2) {
        ctx.beginPath();
        ctx.arc(512, 512, r, 0, Math.PI * 2);
        if (r % 14 === 0) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
          ctx.lineWidth = 1.2;
        } else {
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.lineWidth = 0.8;
        }
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(512, 512, 496, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tex;
    }

    const texLoader = new THREE.TextureLoader();

    function loadCachedTexture(url, callback) {

        callback(textureCache.get(url));
        return;

      texLoader.load(
        url,
        (tex) => {
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.minFilter = THREE.LinearFilter;
          tex.magFilter = THREE.LinearFilter;
          tex.generateMipmaps = false;
          tex.needsUpdate = true;
          textureCache.set(url, tex);
          callback(tex);
        },
        undefined,
        (err) => {
          console.error("貼圖載入失敗:", url, err);
        }
      );

        coverMesh.material[5].needsUpdate = true;

      autoRotStartTime = performance.now();
      turntableGroup.rotation.y = 0;
      targetRotY = 0;
      targetRotX = 0;
    }

    function onPointerDown(e) {
      isAutoRotating = false;
      isTouching = true;
      hasMoved = false;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      prevPointerX = clientX;
      prevPointerY = clientY;
    }

    function onPointerMove(e) {
      if (!isTouching) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const deltaX = clientX - prevPointerX;
      const deltaY = clientY - prevPointerY;

      if (Math.abs(deltaX) > 3 || Math.abs(deltaY) > 3) {
        hasMoved = true;
      }

      targetRotY += deltaX * 0.008;
      targetRotX += deltaY * 0.006;
      targetRotX = Math.max(-0.55, Math.min(0.55, targetRotX));

      prevPointerX = clientX;
      prevPointerY = clientY;
    }

    function onPointerUp() {
      if (!hasMoved && isTouching) {
        triggerResetView();
      }
      isTouching = false;
    }

    const stageEl = renderer.domElement;
    stageEl.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    stageEl.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    function triggerResetView() {
      isAutoRotating = false;
      targetRotX = 0;
      targetRotY = 0;
    }

    window.addEventListener('resize', resizeCamera);
    resizeCamera();

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      // 黑膠轉動核心：只要播放中或旋轉展示中皆平滑自轉
      if (isPlaying || isAutoRotating) {
        discSpinGroup.rotation.z -= 0.014;
      }

      if (isAutoRotating) {
        const elapsed = performance.now() - autoRotStartTime;
        const progress = Math.min(1, elapsed / AUTO_ROT_DURATION);
        turntableGroup.rotation.y = progress * (Math.PI * 2);
        turntableGroup.rotation.x = THREE.MathUtils.lerp(turntableGroup.rotation.x, 0, 0.08);

        if (progress >= 1) {
          isAutoRotating = false;
          turntableGroup.rotation.y = 0;
          targetRotY = 0;
          targetRotX = 0;
        }
      } else {
        turntableGroup.rotation.y = THREE.MathUtils.lerp(turntableGroup.rotation.y, targetRotY, 0.1);
        turntableGroup.rotation.x = THREE.MathUtils.lerp(turntableGroup.rotation.x, targetRotX, 0.1);
      }

      // 黑膠唱片滑出 / 收合
      if (isPlaying) {
        discGroup.position.x = THREE.MathUtils.lerp(discGroup.position.x, VINYL_OUT_X, 0.06);
      } else {
        discGroup.position.x = THREE.MathUtils.lerp(discGroup.position.x, VINYL_REST_X, 0.06);
      }

      renderer.render(scene, camera);
    }
    renderLoop();

    /* -------------------------------------------------------------
     * 4. 音訊系統 (參照 WINTER PLAYLIST：原生極速切換)
     * ------------------------------------------------------------*/
    function setPlayState(active) {
      isPlaying = active;
      const svg = document.getElementById('play-svg-icon');
      if (active) {
        svg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        svg.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = active ? "playing" : "paused";
      }
    }

    function updateProgressUI(cur, total) {
      currentSec = cur;
      totalDuration = total || 211;
      const pct = Math.min(100, Math.max(0, (cur / totalDuration) * 100));
      document.getElementById('seek-progress').style.width = `${pct}%`;
      const curM = Math.floor(cur / 60);
      const curS = Math.floor(cur % 60);
      const totM = Math.floor(totalDuration / 60);
      const totS = Math.floor(totalDuration % 60);
      document.getElementById('lbl-curr').textContent = `${String(curM).padStart(2,'0')}:${String(curS).padStart(2,'0')}`;
      document.getElementById('lbl-total').textContent = `${String(totM).padStart(2,'0')}:${String(totS).padStart(2,'0')}`;
      syncLyrics(cur);
      
      if ('mediaSession' in navigator && ('setPositionState' in navigator.mediaSession) && totalDuration > 0) {
        try {
          navigator.mediaSession.setPositionState({
            duration: totalDuration,
            playbackRate: nativeAudio.playbackRate || 1,
            position: Math.min(cur, totalDuration)
          });
        } catch(e) {}
      }
    }

    nativeAudio.addEventListener('timeupdate', () => {
      if (playMode !== 'file' || isDraggingSeek) return;
      updateProgressUI(nativeAudio.currentTime, nativeAudio.duration || totalDuration);
    });

    nativeAudio.addEventListener('playing', () => {
      setPlayState(true);
      isAutoSwitching = false;
    });

    nativeAudio.addEventListener('pause', () => {
      if (!isAutoSwitching) {
        setPlayState(false);
      }
    });

    nativeAudio.addEventListener('ended', () => {
      playNext(true);
    });

    function startYtProgressTimer() {
      clearInterval(ytTimer);
      ytTimer = setInterval(() => {
        if (!isPlaying || playMode !== 'yt' || isDraggingSeek) return;
        currentSec += 0.25;
        updateProgressUI(currentSec, totalDuration);
        if (currentSec >= totalDuration) {
          playNext(true);
        }
      }, 250);
    }

    // 極速播放通道（比照 WINTER PLAYLIST，秒讀秒出聲）
    function playActiveSong(isNewTrack = false, isAutoNext = false) {
      const curPl = store[plIdx];
      if (!curPl || !curPl.songs[trackIdx]) return;
      const song = curPl.songs[trackIdx];

      // 1. 介面立即響應
      renderUI();
      
      // 2. 比照 WINTER PLAYLIST：在使用者點擊瞬間同步 MediaSession，確保鎖定畫面即時顯示
      updateMediaSession(song, curPl);

      if (isNewTrack || !hasPlayedFirstTrack) {
        triggerSlow15sSpin();
        hasPlayedFirstTrack = true;
      }

      totalDuration = song.duration || 211;
      const ytId = extractYoutubeId(song.source);
      const targetVolume = (typeof song.volume === 'number') ? song.volume : (plIdx === 1 ? 1.6 : 1.0);

      if (ytId) {
        playMode = 'yt';
        nativeAudio.pause();
        nativeAudio.removeAttribute('src');

        const startSec = Math.floor(currentSec || 0);
        ytIframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&start=${startSec}&playsinline=1&controls=0&enablejsapi=1`;
        setPlayState(true);
        startYtProgressTimer();
      } else {
        playMode = 'file';
        clearInterval(ytTimer);
        ytIframe.src = '';

        const directSrc = toAbsUrl(song.source);
        nativeAudio.volume = Math.min(1.0, Math.max(0, targetVolume));

        // 3. 核心秒開：直接指派 src 並喚起 play()，不重新銷毀連線
        if (isNewTrack || nativeAudio.src !== directSrc) {
          isAutoSwitching = isAutoNext;
          currentSec = 0;
          updateProgressUI(0, totalDuration);

          nativeAudio.src = directSrc;
          
          const p = nativeAudio.play();
          if (p !== undefined) {
            p.then(() => {
              setPlayState(true);
              isAutoSwitching = false;
            }).catch(err => {
              if (isAutoNext) {
                setTimeout(() => {
                  nativeAudio.play().then(() => setPlayState(true)).catch(() => setPlayState(false));
                }, 100);
              } else {
                setPlayState(false);
              }
              isAutoSwitching = false;
            });
          }
        } else {
          if (currentSec > 0 && Math.abs(nativeAudio.currentTime - currentSec) > 1) {
            nativeAudio.currentTime = currentSec;
          }
          const p = nativeAudio.play();
          if (p !== undefined) {
            p.then(() => setPlayState(true)).catch(() => setPlayState(false));
          }
        }
      }
    }

    function pauseActiveSong() {
      setPlayState(false);
      isAutoSwitching = false;
      if (playMode === 'file') {
        currentSec = nativeAudio.currentTime;
        nativeAudio.pause();
      } else {
        clearInterval(ytTimer);
        ytIframe.src = '';
      }
    }

    /* -------------------------------------------------------------
     * 5. 進度條拖曳
     * ------------------------------------------------------------*/
    const seekContainer = document.getElementById('seek-container');
    const seekProgress = document.getElementById('seek-progress');

    function getSeekFraction(e) {
      const rect = seekContainer.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const pos = clientX - rect.left;
      return Math.min(1, Math.max(0, pos / rect.width));
    }

    function handleSeekMove(e) {
      if (!isDraggingSeek) return;
      const frac = getSeekFraction(e);
      seekProgress.style.width = `${frac * 100}%`;
      const cur = frac * totalDuration;
      const m = Math.floor(cur / 60);
      const s = Math.floor(cur % 60);
      document.getElementById('lbl-curr').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function handleSeekEnd(e) {
      if (!isDraggingSeek) return;
      isDraggingSeek = false;
      const frac = getSeekFraction(e.changedTouches ? e.changedTouches[0] : e);
      currentSec = frac * totalDuration;

      if (playMode === 'file') {
        nativeAudio.currentTime = currentSec;
      } else {
        if (isPlaying) playActiveSong(false);
      }
      updateProgressUI(currentSec, totalDuration);
    }

    seekContainer.addEventListener('mousedown', (e) => { isDraggingSeek = true; handleSeekMove(e); });
    window.addEventListener('mousemove', handleSeekMove);
    window.addEventListener('mouseup', handleSeekEnd);

    seekContainer.addEventListener('touchstart', (e) => { isDraggingSeek = true; handleSeekMove(e); }, { passive: false });
    window.addEventListener('touchmove', handleSeekMove, { passive: false });
    window.addEventListener('touchend', handleSeekEnd);

    /* -------------------------------------------------------------
     * 6. 歌詞渲染
     * ------------------------------------------------------------*/
    function syncLyrics(sec) {
      const song = store[plIdx]?.songs[trackIdx];
      if (!song || !song.lyrics) return;

      let idx = -1;
      for (let i = 0; i < song.lyrics.length; i++) {
        if (sec >= song.lyrics[i].time) idx = i;
        else break;
      }

      const rows = document.querySelectorAll('.lyric-row');
      rows.forEach((r, i) => {
        if (i === idx) {
          if (!r.classList.contains('active')) {
            r.classList.add('active');
            const scroller = document.getElementById('lyrics-scroller');
            scroller.scrollTo({ top: r.offsetTop - (scroller.clientHeight / 2) + 12, behavior: 'smooth' });
          }
        } else {
          r.classList.remove('active');
        }
      });
    }

    function renderLyricsList() {
      const scroller = document.getElementById('lyrics-scroller');
      scroller.innerHTML = '';
      const song = store[plIdx]?.songs[trackIdx];

      if (!song || !song.lyrics || song.lyrics.length === 0) {
        scroller.innerHTML = '<div class="lyric-row"><div class="lyric-primary">純音樂 / 歌詞準備中</div></div>';
        return;
      }

      song.lyrics.forEach(l => {
        const div = document.createElement('div');
        div.className = 'lyric-row';

        const pSpan = document.createElement('div');
        pSpan.className = 'lyric-primary';
        pSpan.textContent = l.text;
        div.appendChild(pSpan);

        if (l.trans) {
          const tSpan = document.createElement('div');
          tSpan.className = 'lyric-trans';
          tSpan.textContent = l.trans;
          div.appendChild(tSpan);
        }

        div.onclick = () => {
          currentSec = l.time;
          if (playMode === 'file') nativeAudio.currentTime = currentSec;
          else playActiveSong(false);
        };
        scroller.appendChild(div);
      });
    }

    function renderUI() {
      const curPl = store[plIdx];
      const song = curPl?.songs[trackIdx];
      if (!song) return;

      document.getElementById('disp-title').textContent = song.title;
      document.getElementById('disp-artist').textContent = song.artist || "KARINA";

      applyCoverTo3D(
        song.cover || curPl.cover, 
        song.backCover, 
        song.labelImg, 
        song.imgScale || 1.0, 
        song.imgOffsetX || 0.0, 
        song.imgOffsetY || 0.0
      );
      renderLyricsList();
      populateDropdowns();
    }

    function playNext(isAuto = false) {
      const pl = store[plIdx];
      if (!pl || pl.songs.length === 0) return;
      trackIdx = (trackIdx + 1) % pl.songs.length;
      currentSec = 0;
      playActiveSong(true, isAuto);
    }

    function playPrev() {
      const pl = store[plIdx];
      if (!pl || pl.songs.length === 0) return;
      trackIdx = (trackIdx - 1 + pl.songs.length) % pl.songs.length;
      currentSec = 0;
      playActiveSong(true, false);
    }

    document.getElementById('btn-play').onclick = () => {
      if (isPlaying) {
        pauseActiveSong();
      } else {
        playActiveSong(false, false);
      }
    };
    document.getElementById('btn-next').onclick = () => playNext(false);
    document.getElementById('btn-prev').onclick = playPrev;

    function populateDropdowns() {
      const pSel = document.getElementById('sel-playlist');
      pSel.innerHTML = '';
      store.forEach((p, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = p.name;
        if (i === plIdx) opt.selected = true;
        pSel.appendChild(opt);
      });

      const sSel = document.getElementById('sel-song');
      sSel.innerHTML = '';
      const songs = store[plIdx]?.songs || [];
      songs.forEach((s, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = s.title;
        if (i === trackIdx) opt.selected = true;
        sSel.appendChild(opt);
      });
    }

    document.getElementById('sel-playlist').onchange = (e) => {
      plIdx = parseInt(e.target.value);
      trackIdx = 0;
      currentSec = 0;
      playActiveSong(true, false);
    };

    document.getElementById('sel-song').onchange = (e) => {
      trackIdx = parseInt(e.target.value);
      currentSec = 0;
      playActiveSong(true, false);
    };

    /* -------------------------------------------------------------
     * 7. 導覽選單與管理後台控制
     * ------------------------------------------------------------*/

    const mountPoint = document.getElementById('admin-mount-point');

      navModal.style.display = 'flex';

      document.getElementById('local-back-img-picker').onchange = (e) => {

        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          document.getElementById('form-song-back-cover').value = event.target.result;

    window.movePl = (pI, dir) => {

      if (targetIndex < 0 || targetIndex >= store.length) return;
      const temp = store[pI];
      store[pI] = store[targetIndex];
      store[targetIndex] = temp;
      if (plIdx === pI) plIdx = targetIndex;
      else if (plIdx === targetIndex) plIdx = pI;
      renderAdminTree();
      renderUI();

    window.moveSong = (pI, sI, dir) => {
      const songs = store[pI].songs;
      const targetIndex = sI + dir;
      if (targetIndex < 0 || targetIndex >= songs.length) return;
      const temp = songs[sI];
      songs[sI] = songs[targetIndex];
      songs[targetIndex] = temp;
      if (plIdx === pI) {
        if (trackIdx === sI) trackIdx = targetIndex;
        else if (trackIdx === targetIndex) trackIdx = sI;
      }
      renderAdminTree();
      renderUI();
    };

    window.delPl = (pI) => {
      if (store.length <= 1) return alert('請至少保留一個歌單！');
      if (confirm(`確定刪除歌單《${store[pI].name}》？`)) {
        store.splice(pI, 1);
        if (plIdx >= store.length) plIdx = 0;
        trackIdx = 0;
        renderAdminTree();
        renderUI();
      }
    };

    window.delS = (pI, sI) => {
      store[pI].songs.splice(sI, 1);
      if (plIdx === pI && trackIdx >= store[pI].songs.length) {
        trackIdx = Math.max(0, store[pI].songs.length - 1);
      }
      renderAdminTree();
      renderUI();
    };

    window.editS = (pI, sI) => {
      const s = store[pI].songs[sI];
      document.getElementById('form-mode-title').textContent = `✦ 編輯歌曲: ${s.title}`;
      document.getElementById('edit-song-id').value = `${pI}_${sI}`;
      document.getElementById('form-pl-target').value = pI;
      document.getElementById('form-song-title').value = s.title;
      document.getElementById('form-song-artist').value = s.artist || 'KARINA';
      document.getElementById('form-song-source').value = s.source;

      const currentVol = (typeof s.volume === 'number') ? s.volume : (pI === 1 ? 1.6 : 1.0);
      document.getElementById('form-song-vol').value = currentVol;
      document.getElementById('form-vol-lbl').textContent = `${currentVol.toFixed(2)}x`;

      const currentScale = typeof s.imgScale === 'number' ? s.imgScale : 1.0;
      const currentOx = typeof s.imgOffsetX === 'number' ? s.imgOffsetX : 0.0;
      const currentOy = typeof s.imgOffsetY === 'number' ? s.imgOffsetY : 0.0;

      document.getElementById('form-img-scale').value = currentScale;
      document.getElementById('lbl-img-scale').textContent = `${currentScale.toFixed(2)}x`;
      document.getElementById('form-img-ox').value = currentOx;
      document.getElementById('lbl-img-ox').textContent = `${Math.round(currentOx * 100)}%`;
      document.getElementById('form-img-oy').value = currentOy;
      document.getElementById('lbl-img-oy').textContent = `${Math.round(currentOy * 100)}%`;

      document.getElementById('form-song-cover').value = s.cover || '';
      document.getElementById('form-song-label-img').value = s.labelImg || '';
      document.getElementById('form-song-back-cover').value = s.backCover || '';

      const lyricsStr = (s.lyrics || []).map(l => {
        let textPart = `${formatLrcTime(l.time)} ${l.text}`;
        if (l.trans) textPart += `\n${l.trans}`;
        return textPart;
      }).join('\n');
      document.getElementById('form-song-lyrics').value = lyricsStr;

      document.getElementById('btn-cancel-edit').style.display = 'inline-block';
      document.getElementById('admin-modal').scrollTo({ top: 0, behavior: 'smooth' });

      updateLivePreviewBox();
    };

    function resetSongForm() {
      document.getElementById('form-mode-title').textContent = '✦ 新增歌曲';
      document.getElementById('edit-song-id').value = '';
      document.getElementById('form-song-title').value = '';
      document.getElementById('form-song-artist').value = 'KARINA';
      document.getElementById('form-song-source').value = '';
      document.getElementById('form-song-vol').value = 1.0;
      document.getElementById('form-vol-lbl').textContent = '1.00x';

      document.getElementById('form-img-scale').value = 1.0;
      document.getElementById('lbl-img-scale').textContent = '1.00x';
      document.getElementById('form-img-ox').value = 0.0;
      document.getElementById('lbl-img-ox').textContent = '0%';
      document.getElementById('form-img-oy').value = 0.0;
      document.getElementById('lbl-img-oy').textContent = '0%';

      document.getElementById('form-song-cover').value = '';
      document.getElementById('form-song-label-img').value = '';
      document.getElementById('form-song-back-cover').value = '';
      document.getElementById('form-song-lyrics').value = '';
      document.getElementById('img-picker-status').textContent = '';
      document.getElementById('label-img-picker-status').textContent = '';
      document.getElementById('back-img-picker-status').textContent = '';
      document.getElementById('btn-cancel-edit').style.display = 'none';

      updateLivePreviewBox();
    }

    function saveSongHandler() {
      const editKey = document.getElementById('edit-song-id').value;
      const targetPl = parseInt(document.getElementById('form-pl-target').value);
      const title = document.getElementById('form-song-title').value.trim();
      const artist = document.getElementById('form-song-artist').value.trim() || 'KARINA';
      const source = document.getElementById('form-song-source').value.trim();
      const volume = parseFloat(document.getElementById('form-song-vol').value) || 1.0;
      const imgScale = parseFloat(document.getElementById('form-img-scale').value) || 1.0;
      const imgOffsetX = parseFloat(document.getElementById('form-img-ox').value) || 0.0;
      const imgOffsetY = parseFloat(document.getElementById('form-img-oy').value) || 0.0;

      const rawCover = document.getElementById('form-song-cover').value.trim();
      const rawLabelImg = document.getElementById('form-song-label-img').value.trim();
      const rawBackCover = document.getElementById('form-song-back-cover').value.trim();
      
      const cover = rawCover || store[targetPl]?.cover || COVER_UP;
      const labelImg = rawLabelImg || '';
      const backCover = rawBackCover || '';
      const lyricsRaw = document.getElementById('form-song-lyrics').value;

      if (!title || !source) return alert('請填寫完整歌名與音訊來源！');

      const songObj = {
        title,
        artist,
        source,
        volume,
        cover,
        labelImg,
        backCover,
        imgScale,
        imgOffsetX,
        imgOffsetY,
        duration: 210,
        lyrics: parseLrc(lyricsRaw)
      };

      if (editKey) {
        const [oldPI, oldSI] = editKey.split('_').map(Number);
        if (oldPI === targetPl) {
          store[oldPI].songs[oldSI] = songObj;
        } else {
          store[oldPI].songs.splice(oldSI, 1);
          store[targetPl].songs.push(songObj);
        }
      } else {
        store[targetPl].songs.push(songObj);
      }

      renderAdminTree();
      renderUI();
      resetSongForm();
      alert(`歌曲《${title}》已成功儲存！`);
    }

    function addPlaylistHandler() {
      const name = document.getElementById('admin-new-pl-name').value.trim();
      if (!name) return alert('請輸入歌單名稱！');
      store.push({ id: 'pl_' + Date.now(), name, cover: COVER_UP, songs: [] });
      document.getElementById('admin-new-pl-name').value = '';
      renderAdminTree();
      renderUI();
    }

    // 初始化渲染
    renderUI();
  </script>
</body>
</html>
